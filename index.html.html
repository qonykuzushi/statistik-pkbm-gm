<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard PKBM Generasi Mandiri</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #f5f5f5;
      font-family: 'Segoe UI', sans-serif;
    }

    header {
      background-color: #2D6A2F;
      color: white;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    header img {
      height: 40px;
      width: 40px;
      object-fit: contain;
    }

    header div h1 {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.2;
    }

    header div p {
      font-size: 11px;
      opacity: 0.85;
    }

    .iframe-wrapper {
      position: relative;
      width: 100%;
      /* tinggi otomatis mengikuti layar minus header */
      height: calc(100vh - 64px);
    }

    .iframe-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    footer {
      background-color: #2D6A2F;
      color: rgba(255,255,255,0.7);
      text-align: center;
      font-size: 11px;
      padding: 10px;
    }
  </style>
</head>
<body>

  <header>
    <!-- Ganti src logo di bawah dengan URL logo GM kalau ada -->
    <div>
      <h1>PKBM Generasi Mandiri</h1>
      <p>Dashboard Data Peserta Didik — Balikpapan</p>
    </div>
  </header>

  <div class="iframe-wrapper">
    <iframe
      src="https://datastudio.google.com/embed/reporting/b17e3354-01a7-4b9b-854b-1893114b818b/page/b7M7F"
      allowfullscreen
      sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
    </iframe>
  </div>

  <footer>
    &copy; 2026 PKBM Generasi Mandiri · Data diperbarui otomatis
  </footer>

</body>
</html>
