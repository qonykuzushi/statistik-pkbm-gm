<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <title>Dashboard PKBM Generasi Mandiri</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #f5f5f5;
      font-family: 'Montserrat', 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #2D6A2F;
      color: white;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    header div h1 { font-size: 15px; font-weight: 700; line-height: 1.2; }
    header div p  { font-size: 11px; opacity: 0.85; }

    /* TAB NAV */
    .tab-nav {
      display: flex;
      background-color: #1f4d21;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 8px;
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.6);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }

    .tab-btn.active {
      color: #ffffff;
      border-bottom: 3px solid #E8702A;
    }

    /* IFRAME */
    .tab-content { display: none; flex: 1; }
    .tab-content.active { display: flex; flex-direction: column; }

    .iframe-wrapper {
      flex: 1;
      position: relative;
      width: 100%;
      min-height: calc(100vh - 110px);
    }

    .iframe-wrapper iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }

    footer {
      background-color: #2D6A2F;
      color: rgba(255,255,255,0.7);
      text-align: center;
      font-size: 11px;
      padding: 10px;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>PKBM Generasi Mandiri</h1>
      <p>Dashboard Data Peserta Didik — Balikpapan</p>
    </div>
  </header>

  <nav class="tab-nav">
    <button class="tab-btn active" onclick="switchTab('aktif', this)">Peserta Didik Aktif</button>
    <button class="tab-btn" onclick="switchTab('lulus', this)">Peserta Didik Lulus</button>
  </nav>

  <!-- TAB AKTIF -->
  <div id="tab-aktif" class="tab-content active">
    <div class="iframe-wrapper">
      <iframe
        src="https://datastudio.google.com/embed/reporting/b17e3354-01a7-4b9b-854b-1893114b818b/page/b7M7F"
        allowfullscreen
        sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
      </iframe>
    </div>
  </div>

  <!-- TAB LULUS -->
  <div id="tab-lulus" class="tab-content">
    <div class="iframe-wrapper">
      <iframe
        src="https://datastudio.google.com/embed/reporting/c44113b9-a9cb-4b6d-b8d2-d6448ba51b3e/page/XG28F"
        allowfullscreen
        sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
      </iframe>
    </div>
  </div>

  <footer>
    &copy; 2026 PKBM Generasi Mandiri · Data diperbarui otomatis
  </footer>

  <script>
    function switchTab(tab, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      btn.classList.add('active');
    }
  </script>

</body>
</html>
